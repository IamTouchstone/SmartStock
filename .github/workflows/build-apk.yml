name: Build & Release Signed Capacitor Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Sync Capacitor Web Assets
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Generate Keystore & Sign APK with apksigner
        run: |
          # Generate signing keystore
          keytool -genkey -v -keystore android.keystore \
            -alias smartstock -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass smartstock123 -keypass smartstock123 \
            -dname "CN=SmartStock, OU=Development, O=SmartStock, L=City, S=State, C=US"

          # Locate generated release APK
          RAW_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found compiled release APK at: $RAW_APK"

          # Find android build-tools
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Using Android Build Tools at: $BUILD_TOOLS"

          # Align & Sign explicitly using apksigner
          $BUILD_TOOLS/zipalign -v -f 4 "$RAW_APK" aligned.apk
          $BUILD_TOOLS/apksigner sign --ks android.keystore \
            --ks-key-alias smartstock \
            --ks-pass pass:smartstock123 \
            --key-pass pass:smartstock123 \
            --out SmartStock.apk aligned.apk

          # Verify signature
          $BUILD_TOOLS/apksigner verify SmartStock.apk
          echo "Successfully created signed SmartStock.apk!"

      - name: Delete Existing Release (if any)
        run: |
          gh release delete v1.0.0 --yes || true
          git tag -d v1.0.0 || true
          git push origin :refs/tags/v1.0.0 || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release with Signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: SmartStock v1.0.0 Signed Android APK (Capacitor)
          body: |
            ## 📱 SmartStock Mobile App (Capacitor Signed Release APK)
            
            This is the official **signed Android `.apk` package** for SmartStock Inventory Core built using Capacitor.
            
            ### Installation Instructions:
            1. Download **`SmartStock.apk`** below directly to your Android device.
            2. Open the file to install (if prompted, allow "Install from unknown sources" for your browser/file manager).
            3. Launch SmartStock and enjoy full mobile inventory management!
          files: SmartStock.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
