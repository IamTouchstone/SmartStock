name: Build & Release Signed Capacitor Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Generate Keystore & Sign APK
        run: |
          # Create keystore
          keytool -genkey -v -keystore android.keystore \
            -alias smartstock -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass smartstock123 -keypass smartstock123 \
            -dname "CN=SmartStock, OU=Development, O=SmartStock, L=City, S=State, C=US"

          # Find release APK
          RAW_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found compiled release APK: $RAW_APK"

          # Find Android build tools
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Using Build Tools: $BUILD_TOOLS"

          # Align & Sign APK
          $BUILD_TOOLS/zipalign -v -f 4 "$RAW_APK" aligned.apk
          $BUILD_TOOLS/apksigner sign --ks android.keystore \
            --ks-key-alias smartstock \
            --ks-pass pass:smartstock123 \
            --key-pass pass:smartstock123 \
            --out SmartStock.apk aligned.apk

          # Verify signature
          $BUILD_TOOLS/apksigner verify SmartStock.apk
          echo "Signature verified successfully!"

      - name: Create or Update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "SmartStock.apk"
          tag: "v1.0.0"
          name: "SmartStock v1.0.0 Signed Android APK"
          body: |
            ## 📱 SmartStock Mobile App (Signed Release APK)
            
            This is the official **signed Android `.apk` package** for SmartStock Inventory Core built using Capacitor.
            
            ### Installation Instructions:
            1. Download **`SmartStock.apk`** below directly to your Android device.
            2. Open the file to install (allow "Install from unknown sources" if prompted).
            3. Launch SmartStock and enjoy full mobile inventory management!
          allowUpdates: true
          recreateRelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
