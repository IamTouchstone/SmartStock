name: Build & Release SmartStock APK

on:
  push:
    branches: [ main, master ] # Supports both main and master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EAS_TOKEN }}

      - name: Build Android APK with EAS
        run: eas build --platform android --profile preview --non-interactive --wait --output app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SmartStock v1.0.${{ github.run_number }} APK
          body: |
            ## SmartStock Mobile App
            Official signed Android APK built with EAS.
            
            ### Install:
            1. Download app-release.apk below
            2. Allow "Install from unknown sources"
          files: app-release.apk
